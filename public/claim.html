<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<title>Claim your app — AlphaCode</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0b0f;--bg2:#161923;--fg:#eef1f7;--fg2:#a6aebe;--fg3:#6e7789;--acc:#f2854f;--acc2:#ffa473;--ok:#4fd68b;--err:#f0646e;--line:rgba(255,255,255,.1);--grad:linear-gradient(135deg,#ff9d5c,#f2653f 55%,#e2566a);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(60% 50% at 50% -10%,rgba(242,133,79,.16),transparent 70%),var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(520px,100%);background:rgba(22,25,35,.9);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#22100a;font-weight:900;font-size:17px}
.brand b{font-size:15px}
.brand small{display:block;color:var(--fg3);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
p{color:var(--fg2);margin:0 0 16px}
.url{font-family:var(--mono);font-size:12.5px;background:#08090d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-all;color:var(--acc2);margin-bottom:16px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg3);margin-bottom:20px}
.badge{font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(79,214,139,.14);color:var(--ok);border:1px solid rgba(79,214,139,.3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:.16s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--grad);border-color:transparent;color:#1c0e05;box-shadow:0 8px 24px rgba(242,101,63,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:10px}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);font-size:14px;margin-bottom:10px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.hint{font-size:12px;color:var(--fg3);margin-top:14px}
.err{border-color:rgba(240,100,110,.4);background:rgba(240,100,110,.1);color:var(--err);padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--acc2);border-radius:99px;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
code{font-family:var(--mono);font-size:.9em;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="mark">α</div><div><b>AlphaCode</b><small>claim a deployment</small></div></div>
  <div id="content"><p><span class="spin"></span> Loading deployment…</p></div>
</div>
<script type="module">
const token = location.pathname.split('/').filter(Boolean).pop();
const content = document.getElementById('content');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function load() {
  try {
    const res = await fetch(`/api/claim/${encodeURIComponent(token)}`, { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Invalid claim link');
    render(data);
  } catch (err) {
    content.innerHTML = `<div class="err">${esc(err.message)}</div><a class="btn" href="/">Open AlphaCode</a>`;
  }
}

function render(data) {
  const d = data.deployment;
  if (d.claimed) {
    content.innerHTML = `<h1>Already claimed</h1><p>This deployment belongs to an AlphaCode account already.</p>
      <div class="url">${esc(d.url)}</div><a class="btn primary" href="${esc(d.url)}" target="_blank" rel="noopener">Open the app</a>`;
    return;
  }
  content.innerHTML = `
    <h1>Claim this app</h1>
    <p>An AlphaCode agent built this and published a preview. Claim it to keep it, get the project files, and re-deploy to Cloudflare, Netlify or Vercel.</p>
    <div class="url">${esc(d.url)}</div>
    <div class="meta"><span class="badge">ready</span><span>${d.files || 0} files</span><span>${esc(d.framework || 'static')}</span><span>expires ${new Date(d.expiresAt).toLocaleString()}</span></div>
    ${data.requiresAuth ? `
      <div id="auth">
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <input id="password" type="password" placeholder="password (min 8 chars)" autocomplete="current-password">
        <div class="row">
          <button class="btn primary" id="signin">Sign in &amp; claim</button>
          <button class="btn" id="signup">Create account</button>
        </div>
        <div class="hint">No password? Create an account in one step — you get 40 agent requests/day.</div>
      </div>` : `<button class="btn primary" id="claim">Claim this deployment</button>`}
    <div class="hint">Prefer the terminal? <code>alphacode claim ${esc(token).slice(0, 10)}…</code> or paste the link into the AlphaCode chat with <code>/claim</code>.</div>
    <div id="status" class="hint"></div>`;
  const status = content.querySelector('#status');
  const doClaim = async () => {
    status.textContent = 'Claiming…';
    const res = await fetch(`/api/claim/${encodeURIComponent(token)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: '{}' });
    const json = await res.json();
    if (!res.ok) {
      status.innerHTML = `<span style="color:var(--err)">${esc(json.error || 'Claim failed')}</span>`;
      return;
    }
    content.innerHTML = `<h1>Claimed 🎉</h1><p>${esc(json.message || 'The project is yours.')}</p>
      <div class="url">${esc(json.url)}</div>
      <a class="btn primary" href="${esc(json.url)}" target="_blank" rel="noopener">Open your app</a>
      <a class="btn" style="margin-top:10px" href="/?project=${encodeURIComponent(json.projectId || '')}">Open the project in AlphaCode</a>`;
  };
  if (!data.requiresAuth) {
    content.querySelector('#claim').onclick = doClaim;
    return;
  }
  const email = content.querySelector('#email');
  const password = content.querySelector('#password');
  const auth = async (path) => {
    status.textContent = 'Signing in…';
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email: email.value.trim(), password: password.value }),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      status.innerHTML = `<span style="color:var(--err)">${esc(json.error || 'Sign-in failed')}</span>`;
      return;
    }
    await doClaim();
  };
  content.querySelector('#signin').onclick = () => auth('/api/auth/login');
  content.querySelector('#signup').onclick = () => auth('/api/auth/register');
}

load();
</script>
</body>
</html>
